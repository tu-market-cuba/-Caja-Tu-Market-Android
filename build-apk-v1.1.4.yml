name: Compilar Caja Tu Market v1.1.4 correcta

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer exclusivamente el proyecto v1.1.4
        run: |
          mkdir proyecto-correcto
          unzip -q Caja-Tu-Market-Android-Proyecto-1.1.4.zip -d proyecto-correcto
          test -f proyecto-correcto/TuMarketAndroid/app/build.gradle
          grep -q "versionName '1.1.4'" proyecto-correcto/TuMarketAndroid/app/build.gradle
          grep -q "Ventas y recibos · v1.1.4" proyecto-correcto/TuMarketAndroid/app/src/main/assets/web/caja.html

      - name: Compilar APK v1.1.4
        working-directory: proyecto-correcto/TuMarketAndroid
        run: gradle assembleDebug

      - name: Guardar APK correcto
        uses: actions/upload-artifact@v4
        with:
          name: Caja-Tu-Market-v1.1.4-CORRECTA
          path: proyecto-correcto/TuMarketAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
